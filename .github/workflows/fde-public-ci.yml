name: FDE Accounting Finance Audit Public Showcase
on:
  push:
    branches: [main, release/fde-accounting-finance-audit-public]
    paths:
      - 'fde-accounting-finance-audit/**'
      - '.github/workflows/fde-public-ci.yml'
  pull_request:
    paths:
      - 'fde-accounting-finance-audit/**'
      - '.github/workflows/fde-public-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: fde-accounting-finance-audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: fde-accounting-finance-audit/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python compilation
        run: python -m compileall -q app research
      - name: Run tests
        run: python -m pytest -q
      - name: Check reproducible synthetic exercise
        run: python -m research.synthetic_control_benchmark --cases 200 --seed 20261105
